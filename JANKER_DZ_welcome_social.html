<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>index.html</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#080808,#202020);color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:min(430px,100%);text-align:center;background:#141414;border:1px solid #333;border-radius:30px;padding:38px 22px;box-shadow:0 25px 70px #0009;animation:show .8s ease}
.logo{width:90px;height:90px;margin:auto;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;animation:pop .8s ease}
h1{font-size:30px;margin:22px 0 8px;animation:fade 1.2s ease}
.welcome{font-size:21px;font-weight:700;margin:0 0 28px;animation:fade 1.6s ease}
.buttons{animation:up 1.8s ease}
a{display:block;color:#fff;text-decoration:none;background:#242424;border:1px solid #444;border-radius:16px;padding:16px;margin:12px 0;font-size:18px;font-weight:700}
a:active{transform:scale(.98)}
.footer{color:#777;font-size:13px;margin-top:24px}
@keyframes show{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">JDZ</div>
  <h1>JANKER DZ</h1>
  <div class="welcome">مرحباً بك في JANKER DZ 👋</div>
  <div class="buttons">
    <a href="https://tiktok.com/@jankerdz" target="_blank">🎵 TikTok</a>
    <a href="https://t.me/Algeria41" target="_blank">✈️ Telegram</a>
    <a href="https://www.facebook.com/share/19idxQ1igs/" target="_blank">📘 Facebook</a>
  </div>
  <div class="footer">تابعنا على مواقع التواصل الاجتماعي</div>
</div>
</body>
</html>
