* {

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 0%, #5a4508 0%, #181818 28%, #050505 70%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* البطاقة الرئيسية */
.card {
    width: 100%;
    max-width: 430px;
    padding: 40px 24px 30px;
    text-align: center;

    background: linear-gradient(
        145deg,
        #111111,
        #191919,
        #080808
    );

    border: 2px solid #d4af37;
    border-radius: 28px;

    box-shadow:
        0 0 15px rgba(212,175,55,0.35),
        0 0 50px rgba(212,175,55,0.15);

    position: relative;
    overflow: hidden;
}

/* تأثير ذهبي أعلى البطاقة */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 3px;
    background: linear-gradient(
        90deg,
        transparent,
        #fff2a6,
        #d4af37,
        #fff2a6,
        transparent
    );
}
